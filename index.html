<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#2D9B8B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="家庭成长手册 - 记录家庭每一个美好瞬间">
  <title>成长手册</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- 侧边栏导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">🌱</div>
        <div class="app-title">成长手册</div>
        <div class="sync-indicator" id="syncIndicator" title="同步状态">
          <span class="sync-dot sync-dot-off" id="syncStatusDot"></span>
          <span class="sync-text" id="syncStatusText">离线</span>
        </div>
      </div>
      <nav class="nav-list" id="navList">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">🏠</span><span class="nav-label">首页</span>
        </a>
        <a href="#album" class="nav-item" data-page="album">
          <span class="nav-icon">📸</span><span class="nav-label">家庭相册</span>
        </a>
        <a href="#bills" class="nav-item" data-page="bills">
          <span class="nav-icon">🧾</span><span class="nav-label">家庭账单</span>
        </a>
        <a href="#finance" class="nav-item" data-page="finance">
          <span class="nav-icon">💰</span><span class="nav-label">收支明细</span>
        </a>
        <a href="#chores" class="nav-item" data-page="chores">
          <span class="nav-icon">🧹</span><span class="nav-label">家务分工</span>
        </a>
        <a href="#diplomacy" class="nav-item" data-page="diplomacy">
          <span class="nav-icon">🤝</span><span class="nav-label">家庭外交</span>
        </a>
        <a href="#calendar" class="nav-item" data-page="calendar">
          <span class="nav-icon">📅</span><span class="nav-label">家庭日历</span>
        </a>
        <a href="#community" class="nav-item" data-page="community">
          <span class="nav-icon">💬</span><span class="nav-label">情绪社区</span>
        </a>
        <a href="#memo" class="nav-item" data-page="memo">
          <span class="nav-icon">📝</span><span class="nav-label">家庭备忘</span>
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span><span class="nav-label">设置</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="current-user" id="currentUserDisplay">
          <div class="user-avatar" id="currentUserAvatar">?</div>
          <div>
            <div class="user-name" id="currentUserName">未设置</div>
            <div class="user-role" id="currentUserRole">点击设置选择成员</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 移动端顶栏 -->
      <header class="mobile-header">
        <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
        <div class="mobile-title">🌱 成长手册</div>
        <div class="mobile-user-avatar" id="mobileUserAvatar">?</div>
      </header>

      <!-- 遮罩层 -->
      <div class="overlay" id="overlay"></div>

      <!-- 页面容器 -->
      <div class="page-container" id="pageContainer">
        <!-- 各页面由 JS 动态渲染 -->
      </div>
    </main>
  </div>

  <!-- 通用模态框 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">标题</h3>
        <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 图片预览 -->
  <div class="image-viewer" id="imageViewer">
    <button class="image-viewer-close" id="imageViewerClose">✕</button>
    <img class="image-viewer-img" id="imageViewerImg" src="" alt="预览">
  </div>

  <!-- 主题切换按钮 -->
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>

  <!-- 返回顶部按钮 -->
  <button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils/chart.js"></script>
  <script src="js/utils/firebase-sync.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/album.js"></script>
  <script src="js/modules/bills.js"></script>
  <script src="js/modules/finance.js"></script>
  <script src="js/modules/chores.js"></script>
  <script src="js/modules/diplomacy.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/community.js"></script>
  <script src="js/modules/memo.js"></script>
  <script src="js/modules/settings.js"></script>
</body>
</html>
